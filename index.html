      resize: vertical;
      border: 0;
      outline: 0;

      color: #e6e9ff;

      white-space: pre;
      overflow: auto;
    }
    .hint {
      margin: 12px 2px 0;
      color: #68708a;
      font-size: 13px;

      body { padding: 15px; }
      h1 { font-size: 21px; }
      #code { min-height: 70vh; font-size: 12px; }
    }
  </style>

        }, 1800);
      } catch (error) {
        editor.focus();
        editor.select();
        document.execCommand("copy");
        document.getElementById("copyButton").textContent = "Copy attempted";
      }
    });
  </script>
</body>
</html>
